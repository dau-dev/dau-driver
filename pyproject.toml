[build-system]
requires = [
    "hatchling",
    "hatch-cpp",
    "nanobind",
]
build-backend = "hatchling.build"

[project]
name = "dau-driver"
authors = [
    {name = "the dau-driver authors", email = "dev@dau.dev"},
]
description = "PCIe Driver for dau"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.12"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # 0.2.0 is the first release with the record layouts and wire facts this reads
    "dau-core>=0.2",
    # read directly by verify_advertisement; it arrives transitively through
    # ccflow today, but a package should declare what it imports
    "pyyaml",
]

[project.optional-dependencies]
# the record-batch codec's Arrow entry points
arrow = [
    "pyarrow",
]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "cibuildwheel",
    "codespell",
    "hatch-cpp",
    "hatchling",
    "mdformat",
    "mdformat-frontmatter",
    "mdformat-tables>=1",
    "nanobind",
    "pyarrow",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]
dau-xdma-macos-probe = "dau_driver.macos_xdma:main"
dau-driver-verify-advertisement = "dau_driver.verify_advertisement:main"

[project.urls]
Repository = "https://github.com/dau-dev/dau-driver"
Homepage = "https://github.com/dau-dev/dau-driver"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "dau_driver/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.cibuildwheel]
build = "cp312-* cp313-*"
test-command = "pytest -vvv {project}/dau_driver/tests"
test-extras = "develop"

[tool.cibuildwheel.linux]
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
skip = "*i686* *musllinux*"
# the container has no host git credentials; the test phase installs the
# [develop] extra whose private deps clone from GitHub
before-test = "sh -c 'if [ -n \"$GIT_AUTH_TOKEN\" ]; then git config --global url.\"https://x-access-token:$GIT_AUTH_TOKEN@github.com/dau-dev/\".insteadOf \"https://github.com/dau-dev/\"; fi'"
environment-pass = ["GIT_AUTH_TOKEN"]

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET="11.0"}
archs = "arm64"

[tool.cibuildwheel.windows]
archs = "AMD64"
skip = "*win32 *arm64"


[tool.coverage.run]
branch = true
omit = [
    "dau_driver/tests/integration/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = [
    "dau_driver/*.dll",
    "dau_driver/*.dylib",
    "dau_driver/*.so",
]

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.hooks.hatch-cpp]
verbose = true
libraries = [
    {name = "dau_driver/extension", sources = ["cpp/dau-driver/extension.cpp"], include-dirs = ["cpp"], binding="nanobind", py-limited-api="cp312"}
]

[tool.hatch.build.targets.sdist]
exclude = ["*.dll", "*.dylib", "*.so", "*.pyd"]
packages = [
    "dau_driver",
    "cpp",
]


[tool.hatch.build.targets.wheel]
artifacts = [
    "dau_driver/*.dll",
    "dau_driver/*.dylib",
    "dau_driver/*.so",
]
packages = [
    "dau_driver",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "dau_driver/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "ARG",  # accepted-but-unused parameters are defects (GUIDELINES Review Rules)
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "dau_driver",
]
known-third-party = [
    "dau_core",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
# test doubles conform to real interfaces and legitimately ignore arguments
"**/tests/**" = ["ARG"]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "dau-driver"
root = "README.md"
pages = [
    "docs/src/tutorial/first-device.md",
    "docs/src/tutorial/first-scan-run.md",
    "docs/src/how-to/find-a-device.md",
    "docs/src/how-to/move-data.md",
    "docs/src/how-to/run-scan-jobs.md",
    "docs/src/how-to/allocate-device-storage.md",
    "docs/src/how-to/arm-the-deadman.md",
    "docs/src/how-to/develop.md",
    "docs/src/reference/device-and-discovery.md",
    "docs/src/reference/execution-contracts.md",
    "docs/src/reference/stream-codec.md",
    "docs/src/explanation/transport-boundary.md",
    "docs/src/explanation/overlapped-staging.md",
    "docs/src/explanation/storage-handles.md",
]
use-autoapi = true
